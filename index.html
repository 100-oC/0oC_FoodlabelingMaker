<!DOCTYPE html>
<html>
    <head>
        <!--ページの説明部分-->
        <!--タブに表示されるタイトルとかの設定-->
        <meta charset="UTF-8">
        <title>食品表示画像メーカー</title>

        <!--TODO:ここで他ファイルを読み込む-->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!--ここに中身-->
        <h1>食品表示画像メーカー</h1>
        
        <!--入力欄-->
        <!--線を入れておく-->
        <hr>
        <p><!--名称-->
            <big><b>①名称</b></big><br>
            <small>　作品のタイトルを入力してください</small><br>
            <input type="text" id="title">
        </p>
        <p><!--原材料名-->
            <big><b>②原材料名</b></big><br>
            <small>　注意事項などリストとして表示しておきたいものを入力してください<br>　（一項目ごとに改行で区切ってください）</small><br>
            <textarea id="ingredients"></textarea>
        </p>
        <p><!--内容量-->
            <big><b>③内容量</b></big><br>
            <small>　枚数やページ数を入力してください</small><br>
            <input type="text" id="contentsSize">
        </p>
        <p><!--製造者-->
            <big><b>④製造者</b></big><br>
            <small>　作成者の名前を入力してください</small><br>
            <input type="text" id="userName">
        </p>
        <hr>
 
        <!--描画領域-->
        <canvas id="preview" width="620" height="420"></canvas>
        <hr>

        <p><!--出力サイズ-->
            <big><b>画像サイズ</b></big><br>
            <small>　画像の倍率を選択してください</small><br>
            <input type="range" id="imageScale" min="0.5" max="2" step="0.1" value="1">
            <small>画像サイズ：<span id="scaleText">600 × 400</span></small>
        </p>

        <!--完成ボタン-->
        <button id="generateButton">発行</button>
        <hr>

        <!--保存領域-->
        <div id="resultOverlay">
            <img id="resultImage">
            <button id="imageCancel">✕</button>
        </div>
        
        <script src="main.js"></script>
    </body>
</html>
